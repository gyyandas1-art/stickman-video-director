name: Stickman comedy episode contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "channel/**"
      - ".github/workflows/stickman-comedy-contract.yml"

permissions:
  contents: read

jobs:
  validate-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate original sample episode
        run: python3 channel/validate_episode.py channel/sample-episode.json
      - name: Check episode schema JSON syntax
        run: python3 -m json.tool channel/episode.schema.json > /dev/null
      - name: Package storyboard review files
        run: |
          mkdir -p output
          cp channel/sample-episode.json output/episode.json
          cp channel/meme-format-spec.md output/production-spec.md
          cp channel/comedy-generation-prompt.md output/generation-prompt.md
          python3 channel/validate_episode.py channel/sample-episode.json > output/validation-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: stickman-comedy-storyboard-review
          path: output/
          retention-days: 14
